name: Update Aggregate Sources

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run merge
        run: python scripts/merge.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sources.json dist/report.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes"
          else
            VOD=$(python -c "import json;d=json.load(open('dist/sources.json'));print(len(d.get('sources',[])))")
            LIVE=$(python -c "import json;d=json.load(open('dist/sources.json'));print(len(d.get('liveSources',[])))")
            git commit -m "chore: update sources $(date -u +'%Y-%m-%d %H:%M UTC') (vod=${VOD}, live=${LIVE})"
            git push
          fi