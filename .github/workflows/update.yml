name: Update Aggregate Sources

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: update-aggregate-sources
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run merge
        run: python scripts/merge.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sources.json dist/tvbox.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update sources $(date -u +'%Y-%m-%d %H:%M UTC')" &&
            git push
          )

      # 只保留最近 2 次 workflow 运行记录（上次 + 这次），其余删除
      - name: Prune old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=2
          WORKFLOW_NAME="Update Aggregate Sources"
          echo "Listing runs for: $WORKFLOW_NAME"
          # 按时间倒序，跳过最近 KEEP 条，删除更早的
          mapfile -t RUN_IDS < <(
            gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?per_page=100" \
              --jq '.workflow_runs[].id'
          )
          TOTAL=${#RUN_IDS[@]}
          echo "Found $TOTAL runs, keep $KEEP"
          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Nothing to prune"
            exit 0
          fi
          for ((i=KEEP; i<TOTAL; i++)); do
            RID="${RUN_IDS[$i]}"
            echo "Deleting run $RID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${RID}" || true
          done
