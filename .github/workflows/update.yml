name: Update Aggregate Sources

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run merge
        run: python scripts/merge.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/sources.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: update sources $(date -u +'%Y-%m-%d %H:%M UTC')" &&
            git push
          )
