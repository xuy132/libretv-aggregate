name: Update Aggregate Sources

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时
  workflow_dispatch:

concurrency:
  group: update-aggregate-sources
  cancel-in-progress: true   # 有新任务时取消旧的，只保留最近一次

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run merge
        run: python scripts/merge.py

      - name: Validate output
        id: validate
        run: |
          set -e
          test -f dist/sources.json
          python << 'PY'
          import json, sys
          with open("dist/sources.json", encoding="utf-8") as f:
              data = json.load(f)
          vod = data.get("sources") or []
          live = data.get("liveSources") or []
          if not isinstance(vod, list) or not isinstance(live, list):
              print("sources/liveSources 格式错误")
              sys.exit(1)
          # 至少要有一类可用源，避免空结果覆盖上次成功产物
          if len(vod) == 0 and len(live) == 0:
              print("点播和直播都为空，视为失败，不提交")
              sys.exit(1)
          # 可选：点播过少也视为异常（按需调整或删掉）
          # if len(vod) < 3:
          #     print(f"点播过少 ({len(vod)})，不提交")
          #     sys.exit(1)
          print(f"OK: vod={len(vod)}, live={len(live)}")
          with open("dist/report.json", "a", encoding="utf-8"):
              pass  # report 允许没有，下面 commit 时再判断
          PY

      - name: Commit only on success + change
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # report.json 可能不存在时仍可只提交 sources.json
          FILES="dist/sources.json"
          if [ -f dist/report.json ]; then
            FILES="$FILES dist/report.json"
          fi

          git add $FILES

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          VOD=$(python -c "import json;d=json.load(open('dist/sources.json'));print(len(d.get('sources') or []))")
          LIVE=$(python -c "import json;d=json.load(open('dist/sources.json'));print(len(d.get('liveSources') or []))")
          git commit -m "chore: update sources $(date -u +'%Y-%m-%d %H:%M UTC') (vod=${VOD}, live=${LIVE})"
          git push